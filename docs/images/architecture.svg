<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8d94a8"/></marker></defs><rect x="0" y="0" width="1200" height="470" rx="24" fill="#0b0d12" opacity="1"/><text x="600" y="46" font-size="24" fill="#fff" font-weight="800" text-anchor="middle" >How the pieces fit</text><text x="600" y="72" font-size="14" fill="#8d94a8" font-weight="500" text-anchor="middle" >One backend does the thinking. The dashboard, Telegram and your phone are windows onto it.</text><rect x="40" y="120" width="250" height="84" rx="16" fill="#12161f" opacity="1" stroke="#e5242b" stroke-width="2"/><rect x="40" y="120" width="8" height="84" rx="4" fill="#e5242b" opacity="1"/><text x="66" y="154" font-size="18" fill="#fff" font-weight="800" text-anchor="start" >YouTube live chat</text><text x="66" y="178" font-size="13" fill="#8d94a8" font-weight="500" text-anchor="start" >Messages in, actions out</text><rect x="40" y="250" width="250" height="84" rx="16" fill="#12161f" opacity="1" stroke="#4aa3ff" stroke-width="2"/><rect x="40" y="250" width="8" height="84" rx="4" fill="#4aa3ff" opacity="1"/><text x="66" y="284" font-size="18" fill="#fff" font-weight="800" text-anchor="start" >Telegram</text><text x="66" y="308" font-size="13" fill="#8d94a8" font-weight="500" text-anchor="start" >Alerts and owner commands</text><rect x="390" y="100" width="420" height="260" rx="20" fill="#161c2b" opacity="1" stroke="#7d95ff" stroke-width="2"/><text x="420" y="140" font-size="22" fill="#fff" font-weight="800" text-anchor="start" >SavahBot backend</text><text x="420" y="164" font-size="13" fill="#8d94a8" font-weight="500" text-anchor="start" >Python 3.13 · Starlette · Railway</text><rect x="420" y="190" width="176" height="38" rx="10" fill="#0f1320" opacity="1" stroke="#7d95ff" stroke-width="1.5"/><text x="508" y="215" font-size="13" fill="#e8ecf6" font-weight="700" text-anchor="middle" >Detectors</text><rect x="610" y="190" width="176" height="38" rx="10" fill="#0f1320" opacity="1" stroke="#3ccf93" stroke-width="1.5"/><text x="698" y="215" font-size="13" fill="#e8ecf6" font-weight="700" text-anchor="middle" >Knowledge packs</text><rect x="420" y="240" width="176" height="38" rx="10" fill="#0f1320" opacity="1" stroke="#f0b34a" stroke-width="1.5"/><text x="508" y="265" font-size="13" fill="#e8ecf6" font-weight="700" text-anchor="middle" >Commands &amp; timers</text><rect x="610" y="240" width="176" height="38" rx="10" fill="#0f1320" opacity="1" stroke="#ff6b76" stroke-width="1.5"/><text x="698" y="265" font-size="13" fill="#e8ecf6" font-weight="700" text-anchor="middle" >Notifications</text><rect x="420" y="290" width="176" height="38" rx="10" fill="#0f1320" opacity="1" stroke="#c3c9d8" stroke-width="1.5"/><text x="508" y="315" font-size="13" fill="#e8ecf6" font-weight="700" text-anchor="middle" >Backup &amp; restore</text><rect x="610" y="290" width="176" height="38" rx="10" fill="#0f1320" opacity="1" stroke="#e5242b" stroke-width="1.5"/><text x="698" y="315" font-size="13" fill="#e8ecf6" font-weight="700" text-anchor="middle" >Pairing &amp; feed</text><rect x="520" y="392" width="170" height="52" rx="12" fill="#12161f" opacity="1" stroke="#3ccf93" stroke-width="2"/><text x="605" y="424" font-size="16" fill="#fff" font-weight="800" text-anchor="middle" >PostgreSQL</text><path d="M605 360L605 392" stroke="#8d94a8" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="910" y="120" width="250" height="84" rx="16" fill="#12161f" opacity="1" stroke="#7d95ff" stroke-width="2"/><rect x="910" y="120" width="8" height="84" rx="4" fill="#7d95ff" opacity="1"/><text x="936" y="154" font-size="18" fill="#fff" font-weight="800" text-anchor="start" >Web dashboard</text><text x="936" y="178" font-size="13" fill="#8d94a8" font-weight="500" text-anchor="start" >Vercel · TypeScript, no framework</text><rect x="910" y="250" width="250" height="84" rx="16" fill="#12161f" opacity="1" stroke="#e5242b" stroke-width="2"/><rect x="910" y="250" width="8" height="84" rx="4" fill="#e5242b" opacity="1"/><text x="936" y="284" font-size="18" fill="#fff" font-weight="800" text-anchor="start" >SavahLive</text><text x="936" y="308" font-size="13" fill="#8d94a8" font-weight="500" text-anchor="start" >Android overlay app</text><path d="M290 162H340V210H388" stroke="#e5242b" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><text x="318" y="150" font-size="12" fill="#e5242b" font-weight="600" text-anchor="middle" >reads</text><path d="M388 258H340V292H292" stroke="#4aa3ff" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><text x="340" y="244" font-size="12" fill="#4aa3ff" font-weight="600" text-anchor="middle" >alerts</text><path d="M812 210H860V162H908" stroke="#7d95ff" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><text x="860" y="198" font-size="12" fill="#7d95ff" font-weight="600" text-anchor="middle" >HTTPS</text><path d="M812 258H860V292H908" stroke="#e5242b" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><text x="860" y="246" font-size="12" fill="#e5242b" font-weight="600" text-anchor="middle" >live feed</text></svg>